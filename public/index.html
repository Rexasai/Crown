<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CROWN PS Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast"></div>

<section id="auth" class="auth">
  <div class="authbox">
    <div class="logo">♛ CROWN PS</div>
    <div class="sub">GROWTOPIA PRIVATE SERVER</div>
    <div class="tabs"><button class="tab active" data-t="login">LOGIN</button><button class="tab" data-t="register">REGISTRASI</button></div>

    <form id="loginForm">
      <label>GROW ID<input id="lgGrow" required placeholder="NAMA GTPS"></label>
      <label>NAME<input id="lgName" required placeholder="NAMA"></label>
      <label>PASSWORD<input id="lgPass" type="password" required placeholder="PASSWORD"></label>
      <div class="err" id="lgErr"></div>
      <button class="primary">LOGIN</button>
    </form>

    <form id="regForm" class="hide">
      <label>GROW ID<input id="rgGrow" required placeholder="NAMA GTPS"></label>
      <label>NAME<input id="rgName" required placeholder="NAMA"></label>
      <label>PASSWORD<input id="rgPass" type="password" minlength="4" required></label>
      <label>CONFIRM PASSWORD<input id="rgConfirm" type="password" minlength="4" required></label>
      <label>EMAIL (opsional)<input id="rgEmail" type="email" placeholder="email@gmail.com"></label>
      <label>NOMER WHATSAPP (opsional)<input id="rgPhone" placeholder="628xxxxxxxxxx"></label>
      <label>REFERRAL<input id="rgRef" placeholder="REFERRAL"></label>
      <div class="err" id="rgErr"></div>
      <button class="primary">REGISTRASI</button>
      <div class="gift">🎁 Akun baru: <b>10 Gacha Ticket GRATIS</b><br>Balance awal: <b>Rp 0</b></div>
    </form>
  </div>
</section>

<div id="app" class="hide">
  <aside id="side">
    <div class="sidehead"><b>♛ CROWN PS</b><button id="closeSide">×</button></div>
    <div class="mini"><div id="avatar" class="avatar">P</div><div><b id="sideName"></b><small id="sideGrow"></small></div></div>
    <nav id="nav"></nav>
    <button id="logout" class="logout">🚪 Logout</button>
  </aside>
  <div id="shade"></div>

  <header>
    <button id="menu">☰</button>
    <b id="title">Home</b>
    <div class="stats"><span>💰 <b id="bal"></b></span><span>🎟️ <b id="tic"></b></span><span>⭐ Lv.<b id="lvl"></b></span></div>
  </header>
  <main id="content"></main>
</div>

<div id="modal" class="modal hide"><div class="modalbox"><button id="xmodal" class="x">×</button><div id="modalbody"></div></div></div>
<script src="app.js"></script>
</body>
</html>
